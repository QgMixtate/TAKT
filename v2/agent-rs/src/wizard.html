<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurveyScan portable — мастер</title>
<style>
:root { --bg:#f6f7f9; --fg:#1d2330; --muted:#5f6b7a; --line:#d8dde4; --card:#fff; --accent:#2457c5; --ok:#1f7a3d; --bad:#b3261e; --warn:#8a5a00; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
header { padding:14px 20px; background:#1d2330; color:#fff; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
header b { font-size:16px; } header span { color:#aab4c3; font-size:12px; }
nav { display:flex; gap:4px; padding:10px 20px 0; flex-wrap:wrap; }
nav button { border:1px solid var(--line); border-bottom:none; background:#e9edf2; padding:8px 14px; border-radius:6px 6px 0 0; cursor:pointer; color:var(--fg); }
nav button.on { background:var(--card); font-weight:600; }
main { background:var(--card); margin:0 20px 20px; border:1px solid var(--line); border-radius:0 6px 6px 6px; padding:18px 20px; }
h2 { margin:0 0 6px; font-size:17px; } p.hint { color:var(--muted); margin:0 0 14px; }
label { display:block; margin:8px 0 3px; font-weight:600; font-size:13px; }
input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:4px; width:100%; max-width:520px; background:#fff; color:var(--fg); }
textarea { min-height:70px; font-family:ui-monospace, Consolas, monospace; }
input::placeholder, textarea::placeholder { font-style:italic; color:#98a2b0; }
button.main, button.sec { margin-top:12px; padding:7px 16px; border-radius:4px; cursor:pointer; font:inherit; }
button.main { background:var(--accent); color:#fff; border:1px solid var(--accent); }
button.sec { background:#fff; color:var(--accent); border:1px solid var(--accent); }
button:disabled { opacity:.5; cursor:default; }
table { border-collapse:collapse; width:100%; margin-top:10px; font-size:13px; }
th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:middle; }
th { background:#f0f2f5; font-weight:600; }
td input, td select { max-width:none; padding:4px 6px; }
.mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; }
pre.log { background:#11151c; color:#d5dbe4; padding:10px; border-radius:4px; max-height:320px; overflow:auto; font-size:12px; white-space:pre-wrap; }
.bar { height:8px; background:#e3e7ec; border-radius:4px; overflow:hidden; max-width:520px; margin-top:10px; } .bar i { display:block; height:100%; background:var(--accent); width:0; }
.ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .muted { color:var(--muted); }
.row { display:flex; gap:16px; flex-wrap:wrap; } .row > div { flex:1 1 240px; }
.msg { margin-top:10px; }
</style>
</head>
<body>
<header><b>SurveyScan portable — мастер аудита</b><span id="where"></span></header>
<nav id="tabs"></nav>
<main id="view"></main>
<script>
"use strict";
const token = location.hash.slice(1);
history.replaceState(null, "", "/");
let st = null, job = null, secrets = {}, selected = new Set(), withHost = true, tab = 0, poll = null, draft = null;
const steps = ["1. Подготовка", "2. Обследование сети", "3. Профили учёток", "4. Узлы и сбор", "5. Пакет"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "X-Token": token, "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const v = await r.json().catch(() => ({ error: "ответ мастера не прочитан" }));
  if (!r.ok) throw new Error(v.error || ("ошибка " + r.status));
  return v;
}
async function refresh() {
  st = await api("GET", "/api/state");
  job = await api("GET", "/api/job");
  if (!draft) draft = JSON.parse(JSON.stringify(st.profiles || { profiles: [], rules: [] }));
  draft.profiles = draft.profiles || []; draft.rules = draft.rules || [];
  $("where").textContent = "каталог аудита: " + st.dir + " · " + st.platform + " · v" + st.version;
  render();
}
function nav() {
  $("tabs").innerHTML = steps.map((s, i) => `<button class="${i === tab ? "on" : ""}" data-tab="${i}">${s}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = +b.dataset.tab; render(); });
}
function jobView(kind) {
  if (!job || job.kind !== kind) return `<div id="jobbox" data-kind="${kind}"></div>`;
  const lines = job.lines || [];
  let pct = null;
  for (const l of lines) { const m = /^\[(\d+)\/(\d+)\]/.exec(l); if (m) pct = Math.round(100 * m[1] / Math.max(1, m[2])); }
  const state = job.running ? `<span class="warn">выполняется…</span>` : job.ok ? `<span class="ok">готово</span>` : `<span class="bad">завершено с ошибкой</span>`;
  return `<div id="jobbox" data-kind="${kind}"><div class="msg">Состояние: ${state}</div>` + (pct !== null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : "") +
    `<pre class="log">${esc(lines.slice(-200).join("\n")) || "…"}</pre></div>`;
}
function watch() {
  if (poll) return;
  poll = setInterval(async () => {
    job = await api("GET", "/api/job").catch(() => job);
    if (!job.running) { clearInterval(poll); poll = null; await refresh(); return; }
    const box = $("jobbox"); // обновляем только журнал, чтобы не сбить ввод в полях
    if (box) box.outerHTML = jobView(box.dataset.kind);
  }, 1000);
}
async function run(path, body) {
  try { await api("POST", path, body); job = await api("GET", "/api/job"); render(); watch(); }
  catch (e) { alert(e.message); }
}
function busy() { return job && job.running; }

function stepInit() {
  if (st.initialized) {
    return `<h2>Каталог аудита подготовлен</h2><p class="hint">Источник portable создан; ключ подписи остаётся на этом носителе.</p>
      <label for="ib2">Блок для центра — скопируйте целиком в Web: «Portable-аудит» → «Зарегистрировать источник»</label>
      <textarea id="ib2" class="mono" rows="7" readonly>${esc(st.init_block || '')}</textarea>
      <button class="sec" id="ibc">Копировать блок</button>
      <label>Шифрование пакета ключом центра</label><div>${st.center_key ? '<span class="ok">включено</span>' : '<span class="warn">не задан ключ центра — пакет не шифруется</span>'}</div>
      <label for="ck">Ключ шифрования центра (base64, из «Portable-аудит»)</label><input id="ck" autocomplete="off" placeholder="например, MCowBQYDK2VuAyEA…">
      <button class="sec" id="ckb">Сохранить ключ центра</button>` + jobView("init");
  }
  return `<h2>Подготовка носителя</h2><p class="hint">Идентификаторы выдаёт центр при создании portable-источника (Web → «Portable-аудит»).</p>
    <div class="row"><div><label for="t">tenant_id</label><input id="t" placeholder="например, 00000000-0000-4000-8000-000000000001"></div>
    <div><label for="s">site_id</label><input id="s"></div><div><label for="sc">scope_id (сетевая область)</label><input id="sc"></div></div>
    <label for="ck">Ключ шифрования центра (необязательно)</label><input id="ck" autocomplete="off">
    <button class="main" id="ib" ${busy() ? "disabled" : ""}>Подготовить</button>` + jobView("init");
}
function bindInit() {
  if ($("ibc")) $("ibc").onclick = async () => { const t = $("ib2"); t.select(); try { await navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); } $("ibc").textContent = "Скопировано"; };
  if ($("ib")) $("ib").onclick = () => run("/api/init", { tenant: $("t").value, site: $("s").value, scope: $("sc").value, center_key: $("ck").value });
  if ($("ckb")) $("ckb").onclick = async () => { try { await api("POST", "/api/center-key", { center_key: $("ck").value }); await refresh(); } catch (e) { alert(e.message); } };
}

function hostsSummary() {
  const d = st.discovery;
  if (!d || !d.hosts) return `<p class="muted">Обследование ещё не выполнялось.</p>`;
  const c = (k) => d.hosts.filter((h) => h.kind === k).length;
  return `<p>Последнее обследование: ${esc(d.finished_at)} — <b>${d.hosts.length}</b> узлов (Linux/SSH ${c("linux_ssh")}, Windows ${c("windows_winrm")}, сетевых ${c("network_snmp")}, не определено ${c("unknown")})${d.complete ? "" : ' <span class="warn">— прервано по сроку</span>'}.</p>`;
}
function stepDiscover() {
  const d = st.discovery || {};
  return `<h2>Обследование сети</h2><p class="hint">Проверяются TCP-порты 22, 23, 80, 135, 443, 445, 5985, 5986; учётные данные не используются.</p>
    <label for="rg">Подсети (по одной в строке)</label><textarea id="rg" placeholder="например, 10.20.1.0/24">${esc((d.ranges || []).join("\n"))}</textarea>
    <label for="ex">Исключить</label><textarea id="ex" placeholder="например, 10.20.1.0/28">${esc((d.excluded || []).join("\n"))}</textarea>
    <label for="rt">Не более подключений в секунду</label><input id="rt" type="number" min="1" max="5000" value="200" style="max-width:140px">
    <br><button class="main" id="db" ${busy() || !st.initialized ? "disabled" : ""}>Начать обследование</button>
    ${st.initialized ? "" : '<p class="warn">Сначала подготовьте каталог аудита (шаг 1).</p>'}` + hostsSummary() + jobView("discover");
}
const lines = (id) => $(id).value.split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean);
function bindDiscover() { if ($("db")) $("db").onclick = () => run("/api/discover", { ranges: lines("rg"), excluded: lines("ex"), rate: +$("rt").value || 200 }); }

function opt(v, list) { return list.map(([k, t]) => `<option value="${k}" ${k === (v || "") ? "selected" : ""}>${t}</option>`).join(""); }
function stepProfiles() {
  const P = draft.profiles, R = draft.rules;
  const pr = P.map((p, i) => `<tr><td><input data-p="${i}" data-f="name" value="${esc(p.name)}" placeholder="например, linux-ro"></td>
    <td><select data-p="${i}" data-f="kind">${opt(p.kind, [["ssh", "SSH (Linux)"], ["winrm", "WinRM (Windows)"]])}</select></td>
    <td><select data-p="${i}" data-f="auth">${opt(p.auth, p.kind === "winrm" ? [["password", "пароль"], ["current_user", "текущая учётка Windows"]] : [["password", "пароль"], ["key", "ключ"]])}</select></td>
    <td><input data-p="${i}" data-f="user" value="${esc(p.user)}" placeholder="${p.kind === "winrm" ? "например, DOMAIN\\audit" : "например, audit"}" ${p.auth === "current_user" ? "disabled" : ""}></td>
    <td><input data-p="${i}" data-f="key_file" value="${esc(p.key_file)}" ${p.auth === "key" ? "" : "disabled"} placeholder="путь к ключу"></td>
    <td><input data-p="${i}" data-f="kdc" value="${esc(p.kdc)}" ${p.kind === "winrm" && p.auth === "password" ? "" : "disabled"} placeholder="KDC (Kerberos)"></td>
    <td><input data-p="${i}" data-f="port" type="number" value="${esc(p.port)}" style="width:80px"></td>
    <td><button class="sec" data-del-p="${i}">✕</button></td></tr>`).join("");
  const rr = R.map((r, i) => `<tr><td>${i + 1}</td><td><select data-r="${i}" data-f="profile">${opt(r.profile, P.map((p) => [p.name, p.name]))}</select></td>
    <td><select data-r="${i}" data-f="kind">${opt(r.kind, [["", "любой"], ["linux_ssh", "Linux/SSH"], ["windows_winrm", "Windows"], ["network_snmp", "сетевое"]])}</select></td>
    <td><input data-r="${i}" data-f="subnet" value="${esc(r.subnet)}" placeholder="например, 10.20.1.0/24"></td>
    <td><input data-r="${i}" data-f="domain" value="${esc(r.domain)}" placeholder="домен Windows"></td>
    <td><button class="sec" data-del-r="${i}">✕</button></td></tr>`).join("");
  const hosts = (st.discovery && st.discovery.hosts) || [];
  return `<h2>Профили учёток</h2><p class="hint">Пароли сюда не записываются: они вводятся при проверке и сборе и живут только в этой вкладке браузера.</p>
    <table><tr><th>Имя</th><th>Вид</th><th>Вход</th><th>Логин</th><th>Ключ SSH</th><th>KDC</th><th>Порт</th><th></th></tr>${pr}</table>
    <button class="sec" id="ap">+ профиль</button>
    <h2 style="margin-top:18px">Правила привязки</h2><p class="hint">Узлу назначается первый подходящий профиль сверху вниз — без перебора паролей.</p>
    <table><tr><th>№</th><th>Профиль</th><th>Вид узла</th><th>Подсеть</th><th>Домен</th><th></th></tr>${rr}</table>
    <button class="sec" id="ar">+ правило</button><br><button class="main" id="sp">Сохранить профили и правила</button>
    <h2 style="margin-top:18px">Проверка на одном узле</h2>
    <div class="row"><div><label for="ti">Узел</label><select id="ti">${hosts.map((h, i) => `<option value="${esc(h.ip)}">${esc(h.ip)} — ${esc(h.kind)} → ${esc(st.bound[i] || "нет профиля")}</option>`).join("")}</select></div>
    <div><label for="tp">Пароль профиля (если нужен)</label><input id="tp" type="password" autocomplete="off"></div></div>
    <button class="main" id="tb" ${busy() || !hosts.length ? "disabled" : ""}>Проверить вход и сбор</button>` + jobView("test");
}
function bindProfiles() {
  document.querySelectorAll("[data-p]").forEach((el) => el.onchange = () => {
    const p = draft.profiles[+el.dataset.p], f = el.dataset.f;
    if (f === "port") { if (el.value) p.port = +el.value; else delete p.port; }
    else if (el.value === "" && f !== "name" && f !== "user") delete p[f]; else p[f] = el.value;
    if (f === "kind") p.auth = "password";
    if (p.auth === "current_user") p.user = "";
    if (p.auth !== "key") delete p.key_file;
    if (!(p.kind === "winrm" && p.auth === "password")) delete p.kdc;
    render();
  });
  document.querySelectorAll("[data-r]").forEach((el) => el.onchange = () => { const r = draft.rules[+el.dataset.r]; if (el.value) r[el.dataset.f] = el.value; else delete r[el.dataset.f]; });
  document.querySelectorAll("[data-del-p]").forEach((b) => b.onclick = () => { draft.profiles.splice(+b.dataset.delP, 1); render(); });
  document.querySelectorAll("[data-del-r]").forEach((b) => b.onclick = () => { draft.rules.splice(+b.dataset.delR, 1); render(); });
  $("ap").onclick = () => { draft.profiles.push({ name: "", kind: "ssh", user: "", auth: "password" }); render(); };
  $("ar").onclick = () => { draft.rules.push({ profile: (draft.profiles[0] || {}).name || "" }); render(); };
  $("sp").onclick = async () => { try { await api("PUT", "/api/profiles", draft); draft = null; await refresh(); alert("Сохранено"); } catch (e) { alert(e.message); } };
  if ($("tb")) $("tb").onclick = () => {
    const ip = $("ti").value, i = (st.discovery.hosts || []).findIndex((h) => h.ip === ip), name = st.bound[i];
    if (!name) { alert("Узлу не назначен профиль: добавьте правило и сохраните."); return; }
    if ($("tp").value) secrets[name] = $("tp").value;
    run("/api/test", { ip, secrets: name in secrets ? { [name]: secrets[name] } : {} });
  };
}

function stepCollect() {
  const hosts = (st.discovery && st.discovery.hosts) || [];
  const used = [...new Set(hosts.map((h, i) => selected.has(h.ip) ? st.bound[i] : null).filter(Boolean))];
  const needPw = used.filter((n) => { const p = (st.profiles.profiles || []).find((x) => x.name === n); return p && p.auth !== "current_user"; });
  const rows = hosts.map((h, i) => `<tr><td><input type="checkbox" data-ip="${esc(h.ip)}" ${selected.has(h.ip) ? "checked" : ""} ${st.bound[i] ? "" : "disabled"} style="width:auto"></td>
    <td class="mono">${esc(h.ip)}</td><td>${esc(h.kind)}</td><td class="mono">${esc((h.ports || []).join(", "))}</td><td>${st.bound[i] ? esc(st.bound[i]) : '<span class="muted">нет профиля</span>'}</td></tr>`).join("");
  return `<h2>Узлы и сбор</h2><p class="hint">Отметьте узлы для сбора. Узлы без профиля попадут в пакет как «нет профиля», снятые — как «пропущен».</p>
    <label><input type="checkbox" id="wh" ${withHost ? "checked" : ""} style="width:auto"> Собрать также этот ПК</label>
    <button class="sec" id="all">Отметить все с профилем</button> <button class="sec" id="none">Снять все</button>
    <table><tr><th></th><th>Адрес</th><th>Вид</th><th>Порты</th><th>Профиль</th></tr>${rows || '<tr><td colspan="5" class="muted">Нет узлов — выполните обследование (шаг 2).</td></tr>'}</table>
    ${needPw.map((n) => `<label for="pw-${esc(n)}">Пароль профиля «${esc(n)}»</label><input type="password" autocomplete="off" id="pw-${esc(n)}" data-pw="${esc(n)}" value="${esc(secrets[n] || "")}">`).join("")}
    <br><button class="main" id="cb" ${busy() || !st.initialized || (!selected.size && !withHost) ? "disabled" : ""}>Собрать и сохранить пакет</button>` + jobView("collect");
}
function bindCollect() {
  const hosts = (st.discovery && st.discovery.hosts) || [];
  document.querySelectorAll("[data-ip]").forEach((c) => c.onchange = () => { c.checked ? selected.add(c.dataset.ip) : selected.delete(c.dataset.ip); render(); });
  document.querySelectorAll("[data-pw]").forEach((c) => c.oninput = () => { secrets[c.dataset.pw] = c.value; });
  $("wh").onchange = () => { withHost = $("wh").checked; render(); };
  $("all").onclick = () => { hosts.forEach((h, i) => st.bound[i] && selected.add(h.ip)); render(); };
  $("none").onclick = () => { selected.clear(); render(); };
  if ($("cb")) $("cb").onclick = () => {
    const s = {}; document.querySelectorAll("[data-pw]").forEach((c) => { if (c.value) s[c.dataset.pw] = c.value; });
    run("/api/collect", { ips: [...selected], host: withHost, secrets: s });
  };
}

function stepResult() {
  if (!job || job.kind !== "collect") return `<h2>Пакет</h2><p class="muted">Сбор ещё не выполнялся (шаг 4).</p>`;
  const lines = job.lines || [];
  const failed = lines.filter((l) => /FAILED:/.test(l));
  const done = lines.filter((l) => /rows=\d+/.test(l));
  const exp = lines.find((l) => l.startsWith("EXPORTED:"));
  return `<h2>Пакет</h2>` + (job.running ? `<p class="warn">Сбор выполняется…</p>` : job.ok && job.package
    ? `<p class="ok">Пакет сохранён:</p><div class="mono">${esc(job.package)}</div><p class="hint">Загрузите его в центр: Web → «Portable-аудит» → «Загрузить пакет».</p>`
    : `<p class="bad">Пакет не сохранён.</p>`) +
    `<p>Собрано: <b>${done.length}</b>, без доступа или недоступно: <b>${failed.length}</b>.</p>` +
    (failed.length ? `<table><tr><th>Узел</th><th>Причина</th></tr>${failed.map((l) => { const m = /^\S+\s+(\S+)\s+FAILED:\s*(\S+)/.exec(l) || []; return `<tr><td class="mono">${esc(m[1])}</td><td>${esc(m[2])}</td></tr>`; }).join("")}</table>` : "") +
    (exp ? `<p class="muted mono">${esc(exp)}</p>` : "");
}

function render() {
  nav();
  const v = $("view");
  const focus = document.activeElement && document.activeElement.id;
  if (tab === 0) { v.innerHTML = stepInit(); bindInit(); }
  if (tab === 1) { v.innerHTML = stepDiscover(); bindDiscover(); }
  if (tab === 2) { v.innerHTML = stepProfiles(); bindProfiles(); }
  if (tab === 3) { v.innerHTML = stepCollect(); bindCollect(); }
  if (tab === 4) { v.innerHTML = stepResult(); }
  if (focus && $(focus)) $(focus).focus();
}
refresh().then(() => { if (job && job.running) watch(); }).catch((e) => { $("view").innerHTML = `<p class="bad">${esc(e.message)}</p>`; });
</script>
</body>
</html>
