[package]
name = "surveyscan-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "SurveyScan host agent and portable (Rust, C52): same C03/C15 wire as the Go agent; one static binary for Linux and Windows"

[[bin]]
name = "surveyscan-agent"
path = "src/main.rs"

[lib]
name = "ssagent"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_jcs = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.12"
pem = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
x509-parser = "0.16"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Services", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_NetworkManagement_NetManagement"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
