name: surveyscan-c15-contract-preparation
on:
  push:
    paths: ['v2/cmd/surveyscan-portable/**', 'docs/plans/surveyscan-v2/contracts/C15/**', 'v2/contracts/c15*', 'v2/internal/platform/wire/inventory12*', 'v2/internal/agent/windowsinventory/**', 'v2/internal/platform/winstate/**', 'v2/internal/platform/diskspool/**', 'v2/internal/platform/privatefile/**', 'v2/internal/platform/machineid/**', 'v2/internal/agent/**', 'v2/internal/platform/winservice/**', 'v2/cmd/surveyscan-agent/**', 'v2/cmd/surveyscan-portable/**', 'v2/internal/portableaudit/**', 'v2/internal/portable/**', 'v2/go.mod', 'v2/go.sum', 'v2/deploy/windows/prepare-winrm-target.ps1', 'v2/agent-rs/**', 'v2/scripts/rust_windows_parity.py', '.github/workflows/c15.yml']
  pull_request:
    paths: ['v2/cmd/surveyscan-portable/**', 'docs/plans/surveyscan-v2/contracts/C15/**', 'v2/contracts/c15*', 'v2/internal/platform/wire/inventory12*', 'v2/internal/agent/windowsinventory/**', 'v2/internal/platform/winstate/**', 'v2/internal/platform/diskspool/**', 'v2/internal/platform/privatefile/**', 'v2/internal/platform/machineid/**', 'v2/internal/agent/**', 'v2/internal/platform/winservice/**', 'v2/cmd/surveyscan-agent/**', 'v2/cmd/surveyscan-portable/**', 'v2/internal/portableaudit/**', 'v2/internal/portable/**', 'v2/go.mod', 'v2/go.sum', 'v2/deploy/windows/prepare-winrm-target.ps1', 'v2/agent-rs/**', 'v2/scripts/rust_windows_parity.py', '.github/workflows/c15.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveyscan-c15-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contract-and-native-baseline:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema checker
        run: python -m pip install -r docs/plans/surveyscan-v2/contracts/C15/requirements.txt
      - name: Synthetic C15 fixtures (no native inventory)
        run: python docs/plans/surveyscan-v2/contracts/C15/validate.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: v2/go.sum
      - name: Go payload validation (synthetic inputs only)
        working-directory: v2
        run: go test -count=1 ./internal/platform/wire
      - name: Native Windows API baseline (isolated, no delivery or service)
        working-directory: v2
        env:
          SURVEYSCAN_C15_TEST_AGENT: ${{ github.workspace }}\v2\surveyscan-agent.exe
        shell: pwsh
        run: |
          go build -o surveyscan-agent.exe ./cmd/surveyscan-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -v ./internal/agent/windowsinventory
      - name: Isolated Windows private DACL, reparse, bounded file and process lock primitives
        working-directory: v2
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/platform/winstate ./internal/platform/diskspool ./internal/platform/machineid ./internal/platform/winservice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -v -run "TestWindowsProfileCacheThroughPrivateAdapters|TestWindowsStateDirIsPrivateAndLocked|TestWindowsPrepareIsStablePrivateAndConfigNeedsPrivateDirectory" ./internal/agent
      - name: Build and run version command only on Windows Server 2022
        working-directory: v2
        shell: pwsh
        run: |
          go build -o surveyscan-agent.exe ./cmd/surveyscan-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & .\surveyscan-agent.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parsed = $version | ConvertFrom-Json
          if ($parsed.component -ne 'agent') { throw 'Unexpected component' }
          Write-Output $version
          Write-Output 'Only isolated baseline APIs, private-state primitives and version were checked; no scheduled Windows sender, runtime adoption, service, update or reboot.'
      - name: Portable audit on Windows Server 2022 (private state DACL, this host to a signed package, verify)
        working-directory: v2
        shell: pwsh
        run: |
          go build -o surveyscan-portable.exe ./cmd/surveyscan-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP 'portable'
          $state = Join-Path $root 'state'
          $init = & .\surveyscan-portable.exe init --state $state --tenant 00000000-0000-4000-8000-000000000051 --site 00000000-0000-4000-8000-000000000052 --scope 00000000-0000-4000-8000-000000000053
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pub = ($init | Select-String '^public_key=(.+)$').Matches[0].Groups[1].Value
          if (-not $pub) { throw 'init printed no public key' }
          $pkg = Join-Path $root 'audit.zip'
          & .\surveyscan-portable.exe inventory-worker os | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "portable inventory-worker subcommand missing ($LASTEXITCODE)" }
          $collected = & .\surveyscan-portable.exe collect --state $state --out $pkg
          if ($LASTEXITCODE -ne 0) { throw "portable collect on Windows failed ($LASTEXITCODE)" }
          $collected | Write-Output
          # стенд №16: пакет создавался, но все разделы были WORKER_FAILED (rows=0) — теперь сбор хоста обязан дать строки
          $rows = ($collected | Select-String 'rows=(\d+)').Matches | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum
          if ($rows.Sum -lt 1) { throw 'portable collected no rows from this Windows host' }
          & .\surveyscan-portable.exe verify --package $pkg --public-key $pub
          if ($LASTEXITCODE -ne 0) { throw "portable package verify failed ($LASTEXITCODE)" }
          $item = Get-Item $pkg
          Write-Output "portable package: $($item.Length) bytes"
      - name: Rust agent on Windows Server 2022 — sections identical to the Go agent on the same host (C52-01)
        working-directory: v2
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path agent-rs/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/rust_windows_parity.py .\surveyscan-portable.exe agent-rs\target\release\surveyscan-agent.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust agent as a LocalSystem service through SCM (install, start, clean stop on missing identity, uninstall)
        working-directory: v2
        shell: pwsh
        run: |
          $exe = (Resolve-Path agent-rs\target\release\surveyscan-agent.exe).Path
          $root = Join-Path $env:RUNNER_TEMP 'rust-svc'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $cfg = Join-Path $root 'agent.json'
          @{ tenant_id = [guid]::NewGuid().ToString(); site_id = [guid]::NewGuid().ToString(); network_scope_id = [guid]::NewGuid().ToString(); collector_url = 'https://collector.invalid:18443'; collector_source_id = [guid]::NewGuid().ToString(); ca_certificate_file = (Join-Path $root 'ca.pem'); state_directory = (Join-Path $root 'state'); inventory_seconds = 0; heartbeat_seconds = 0; jitter_percent = 0; spool_limit_bytes = 0 } | ConvertTo-Json | Set-Content $cfg -Encoding ascii
          & $exe install-service --name SurveyscanRustCi --config $cfg
          if ($LASTEXITCODE -ne 0) { throw "install-service failed ($LASTEXITCODE)" }
          & $exe install-service --name SurveyscanRustCi --config $cfg
          if ($LASTEXITCODE -eq 0) { throw 'second install must be refused' }
          $qc = (sc.exe qc SurveyscanRustCi) -join ' '
          if ($qc -notmatch 'AUTO_START\s+\(DELAYED\)' -or $qc -notmatch 'LocalSystem') { throw "unexpected service config: $qc" }
          sc.exe start SurveyscanRustCi | Out-Null
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500; $q = (sc.exe queryex SurveyscanRustCi) -join ' ' } while ($q -notmatch 'STOPPED' -and (Get-Date) -lt $deadline)
          Write-Output "sc queryex: $q"
          if ($q -notmatch 'STOPPED' -or $q -notmatch '1066') { throw 'service must stop with a service-specific error without an identity' }
          if (-not (Test-Path (Join-Path $root 'state\.state.lock'))) { throw 'service did not reach the state lock' }
          & $exe uninstall-service --name SurveyscanRustCi
          if ($LASTEXITCODE -ne 0) { throw "uninstall-service failed ($LASTEXITCODE)" }
          $deadline = (Get-Date).AddSeconds(10)
          do { Start-Sleep -Milliseconds 200; sc.exe query SurveyscanRustCi | Out-Null } while ($LASTEXITCODE -eq 0 -and (Get-Date) -lt $deadline)
          if ($LASTEXITCODE -eq 0) { throw 'service still present after uninstall' }
          Write-Output 'rust agent service: installed, started by SCM, stopped cleanly (no identity), removed'
          exit 0
      - name: prepare-winrm-target.ps1 under Windows PowerShell 5.1 (local account, run twice — idempotent; stand report 13)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = ConvertTo-SecureString ([guid]::NewGuid().ToString() + 'aA1!') -AsPlainText -Force
          New-LocalUser -Name scanci -Password $pw -AccountNeverExpires | Out-Null
          $acct = "$env:COMPUTERNAME\scanci"
          & .\v2\deploy\windows\prepare-winrm-target.ps1 -Account $acct -Collector 10.0.0.2 -Kerberos
          $second = & .\v2\deploy\windows\prepare-winrm-target.ps1 -Account $acct -Collector 10.0.0.2 -Kerberos 6>&1 | Out-String
          Write-Output $second
          if (-not ($second -match 'WMI root\\cimv2 rights present')) { throw 'second run must find WMI rights already present' }
          if (-not (Test-Path "C:\surveyscan-winrm-$env:COMPUTERNAME.pem")) { throw 'public certificate file missing' }
          Remove-LocalUser -Name scanci
      - name: Compiled agent prepare with an operator-style private config (icacls, no network)
        working-directory: v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'c15-operator'
          $cfgDir = Join-Path $root 'cfg'
          $state = Join-Path $root 'state'
          $user = "$env:USERNAME"
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          # Каталог и каждый файл в нём получают собственный защищённый DACL без унаследованных записей.
          & icacls $cfgDir /inheritance:r /grant:r 'SYSTEM:(OI)(CI)F' 'BUILTIN\Administrators:(OI)(CI)F' "${user}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls directory' }
          $config = @{ tenant_id = [guid]::NewGuid().ToString(); site_id = [guid]::NewGuid().ToString(); network_scope_id = [guid]::NewGuid().ToString(); collector_url = 'https://collector.invalid'; collector_source_id = [guid]::NewGuid().ToString(); ca_certificate_file = (Join-Path $cfgDir 'ca.pem'); state_directory = $state } | ConvertTo-Json
          $file = Join-Path $cfgDir 'agent.json'
          Set-Content -Path $file -Value $config -Encoding utf8NoBOM
          & icacls $file /inheritance:r /grant:r 'SYSTEM:F' 'BUILTIN\Administrators:F' "${user}:F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls file' }
          $first = & .\surveyscan-agent.exe prepare --config $file
          if ($LASTEXITCODE -ne 0) { throw 'prepare failed' }
          $second = & .\surveyscan-agent.exe prepare --config $file
          if ($LASTEXITCODE -ne 0) { throw 'second prepare failed' }
          $a = $first | ConvertFrom-Json
          $b = $second | ConvertFrom-Json
          if (-not $a.source_id -or $a.source_id -ne $b.source_id -or $a.csr_sha256 -ne $b.csr_sha256) { throw 'prepare is not stable' }
          if ($first -match 'PRIVATE KEY') { throw 'prepare printed key material' }
          Write-Output "prepare ok, identity stable (source $($a.source_id))"
      - name: Compiled agent as a LocalSystem service on administrator-prepared state (install, run to Open, uninstall)
        working-directory: v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path .\surveyscan-agent.exe).Path
          # Состояние администратора для службы LocalSystem: в DACL только SYSTEM и Administrators
          # (личный SID пользователя служба отвергла бы — это и есть модель доверия).
          $root = Join-Path $env:RUNNER_TEMP 'c15-service'
          $cfgDir = Join-Path $root 'cfg'
          $state = Join-Path $root 'state'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          & icacls $cfgDir /inheritance:r /grant:r 'SYSTEM:(OI)(CI)F' 'BUILTIN\Administrators:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls directory' }
          $config = @{ tenant_id = [guid]::NewGuid().ToString(); site_id = [guid]::NewGuid().ToString(); network_scope_id = [guid]::NewGuid().ToString(); collector_url = 'https://collector.invalid'; collector_source_id = [guid]::NewGuid().ToString(); ca_certificate_file = (Join-Path $cfgDir 'ca.pem'); state_directory = $state } | ConvertTo-Json
          $file = Join-Path $cfgDir 'agent.json'
          Set-Content -Path $file -Value $config -Encoding utf8NoBOM
          & icacls $file /inheritance:r /grant:r 'SYSTEM:F' 'BUILTIN\Administrators:F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls file' }
          & $exe prepare --config $file | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'administrator prepare failed' }
          $name = 'SurveyscanAgentCi'
          # Относительный путь конфигурации отвергается; повторная установка тоже.
          & $exe install-service --name $name --config 'relative.json' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'relative config accepted' }
          $errFile = Join-Path $env:RUNNER_TEMP 'c15-service-error.txt'
          Remove-Item $errFile -ErrorAction SilentlyContinue
          & $exe install-service --name $name --config $file --error-file $errFile
          if ($LASTEXITCODE -ne 0) { throw 'install-service failed' }
          try {
            & $exe install-service --name $name --config $file 2>$null
            if ($LASTEXITCODE -eq 0) { throw 'second install accepted' }
            $qc = (& sc.exe qc $name) -join "`n"
            if ($qc -notmatch 'LocalSystem') { throw 'service is not LocalSystem' }
            if ($qc -notmatch 'AUTO_START\s+\(DELAYED\)') { throw 'service is not delayed-auto' }
            $startOut = (& sc.exe start $name) -join ' '
            Write-Output "sc start: $($startOut -replace '\s+',' ')"
            $sawRunning = $false
            $exit = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $q = (& sc.exe queryex $name) -join "`n"
              if ($q -match 'RUNNING|START_PENDING') { $sawRunning = $true }
              if ($q -match 'STOPPED' -and ($sawRunning -or $i -ge 4)) {
                Write-Output ('queryex: ' + ($q -replace '\s+',' '))
                if ($q -match 'SERVICE_EXIT_CODE\s*:\s*(\d+)') { $exit = [int]$Matches[1] }
                break
              }
            }
            if ($null -eq $exit) { throw 'service did not stop with a stage code' }
            # 1 = состояние/блокировка/ACL отвергнуты (провал), 2 = дошла до Open: агент не зарегистрирован (ожидаемо).
            if ($exit -eq 1) { throw 'service rejected the administrator-prepared state (stage 1)' }
            if ($exit -ne 2) { throw "unexpected service stage code $exit" }
            Write-Output "service reached Open (stage 2: agent not enrolled); administrator-prepared state accepted by LocalSystem"
          } catch {
            if (Test-Path $errFile) { Write-Output ('service error file: ' + (Get-Content $errFile -Raw)) }
            throw
          } finally {
            & $exe uninstall-service --name $name
            $u = $LASTEXITCODE
            if ($u -ne 0) { throw "uninstall-service failed ($u)" }
            $gone = $false
            for ($i = 0; $i -lt 40; $i++) {
              & sc.exe query $name 2>$null | Out-Null
              if ($LASTEXITCODE -eq 1060) { $gone = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $gone) { throw "service still present after uninstall (sc query exit $LASTEXITCODE)" }
            Write-Output 'service uninstalled'
          }
          exit 0
      - name: Service reinstall and binary upgrade keep the prepared identity (no enroll)
        working-directory: v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path .\surveyscan-agent.exe).Path
          $file = Join-Path $env:RUNNER_TEMP 'c15-service\cfg\agent.json'
          $before = (& $exe prepare --config $file) | ConvertFrom-Json
          # Обновление: новый путь бинарника, служба переустановлена, состояние то же.
          $newExe = Join-Path $env:RUNNER_TEMP 'c15-upgraded-agent.exe'
          Copy-Item $exe $newExe -Force
          $name = 'SurveyscanAgentCiUpgrade'
          & $newExe install-service --name $name --config $file
          if ($LASTEXITCODE -ne 0) { throw 'install after upgrade failed' }
          try {
            & sc.exe start $name | Out-Null
            Start-Sleep -Seconds 4
            $q = (& sc.exe queryex $name) -join ' '
            if ($q -notmatch 'SERVICE_EXIT_CODE\s*:\s*2\b') { throw "service did not reach Open after upgrade: $($q -replace '\s+',' ')" }
          } finally {
            & $newExe uninstall-service --name $name
          }
          $after = (& $newExe prepare --config $file) | ConvertFrom-Json
          if ($before.source_id -ne $after.source_id -or $before.csr_sha256 -ne $after.csr_sha256) { throw 'identity changed across upgrade' }
          Write-Output "identity preserved across reinstall/upgrade (source $($after.source_id)); no enroll, no reboot"
          exit 0
      - name: VM check script under Windows PowerShell 5.1 (the same script the user runs on Server 2019)
        working-directory: v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'vmcheck-ci'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-vm-check.ps1 -Exe (Resolve-Path .\surveyscan-agent.exe).Path -Root (Join-Path $base 'run') -ServiceName SurveyscanAgentVmCi
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $base 'vmcheck-report.txt') -ErrorAction SilentlyContinue; throw "windows-vm-check.ps1 failed ($LASTEXITCODE)" }
          Get-Content (Join-Path $base 'vmcheck-report.txt')
          exit 0
      - name: windows-vm-enroll.ps1 prepare step under Windows PowerShell 5.1 (synthetic template and CA; enroll needs a real center, not run here)
        working-directory: v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'vmenroll-ci'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          $template = Join-Path $base 'agent-config.windows.json'
          @{ tenant_id = [guid]::NewGuid().ToString(); site_id = [guid]::NewGuid().ToString(); network_scope_id = [guid]::NewGuid().ToString(); collector_url = 'https://collector.invalid:18443'; collector_source_id = [guid]::NewGuid().ToString(); ca_certificate_file = 'X'; state_directory = 'X'; inventory_seconds = 60; heartbeat_seconds = 30; jitter_percent = 0; spool_limit_bytes = 1048576 } | ConvertTo-Json | Set-Content $template -Encoding ascii
          Set-Content (Join-Path $base 'ca.pem') 'synthetic' -Encoding ascii
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-vm-enroll.ps1 -Step prepare -Exe (Resolve-Path .\surveyscan-agent.exe).Path -Root (Join-Path $base 'vm') -ConfigTemplate $template -CA (Join-Path $base 'ca.pem')
          if ($LASTEXITCODE -ne 0) { throw "windows-vm-enroll.ps1 prepare failed ($LASTEXITCODE)" }
          $prep = Get-Content (Join-Path $base 'vm\prepare.json') -Raw | ConvertFrom-Json
          if (-not $prep.source_id -or -not $prep.csr_sha256 -or -not $prep.signing_public_key) { throw 'prepare.json lacks fields the center needs' }
          Write-Output "prepare.json OK for source $($prep.source_id)"
          exit 0
      - name: Package test agent binary for manual Windows VM check (build output only, no keys or data)
        working-directory: v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ..\agent-vm | Out-Null
          Copy-Item .\surveyscan-agent.exe ..\agent-vm\surveyscan-agent.exe
          (Get-FileHash ..\agent-vm\surveyscan-agent.exe -Algorithm SHA256).Hash.ToLower() + '  surveyscan-agent.exe' | Set-Content ..\agent-vm\surveyscan-agent.exe.sha256 -Encoding ascii
          Copy-Item .\scripts\windows-vm-check.ps1 ..\agent-vm\windows-vm-check.ps1
          Copy-Item .\scripts\windows-vm-enroll.ps1 ..\agent-vm\windows-vm-enroll.ps1
          Write-Output "commit ${env:GITHUB_SHA}" | Set-Content ..\agent-vm\BUILD.txt -Encoding ascii
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: surveyscan-agent-windows-amd64-test
          path: agent-vm/
          retention-days: 14
          if-no-files-found: error
